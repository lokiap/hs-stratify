[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-stratify"
version = "0.1.0"
description = "Predicting adalimumab response in hidradenitis suppurativa from skin transcriptomics, with cross-cohort validation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lokiap" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["GEOparse>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
hs-stratify = "hs_stratify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
